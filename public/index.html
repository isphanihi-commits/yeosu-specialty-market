<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>여수 특산품 시장</title><link rel="stylesheet" href="style.css"></head><body>
<main><header><div><p class="eyebrow">수요와 공급 보드게임 · 여수편</p><h1>여수 특산품 시장</h1></div><button id="soundToggle" class="sound" title="소리 켜기/끄기">🔊 소리 ON</button><div id="roomLabel"></div></header>
<section id="joinView" class="panel join"><h2>시장에 입장하세요</h2><input id="name" maxlength="16" placeholder="이름"><input id="code" maxlength="8" placeholder="방 코드 (예: YEOSU)"><button id="join">방 만들기 / 참가</button><p>같은 방 코드를 입력하면 함께 플레이합니다.</p></section>
<div id="gameView" hidden><section class="status"><div><span>라운드</span><strong id="round">-</strong></div><p id="message"></p><button id="start" hidden>게임 시작</button></section><section id="eventBox" class="event"></section><section id="changeBox" class="change" hidden></section><section><h2>오늘의 시세</h2><div id="prices" class="prices"></div></section><section><h2>시장 카드</h2><p class="hint">카드를 선택하면 특산품 3개를 가져옵니다. 마지막 카드의 특산품은 공급 과잉으로 시세가 떨어집니다.</p><div id="market" class="market"></div></section><section><h2>투자 현황</h2><div id="players" class="players"></div></section><section id="resultModal" class="result" hidden></section></div></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
